include:
  - template: Jobs/SAST.gitlab-ci.yml

variables:
  IMAGE_NAME: pyweb-app
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

  ACR_NAME: acrhajar2026
  RESOURCE_GROUP: rg-hajar-aca-prf2026
  CONTAINER_APP_NAME: aca-pyweb-hajar

stages:
  - test
  - build
  - deploy
  - infra

# ==========================================
# Common Python configuration
# ==========================================

.python-job:
  image: python:3.14

  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt

# ==========================================
# Lint
# ==========================================

lint:
  extends: .python-job
  stage: test

  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install flake8

  script:
    - flake8 app.py

# ==========================================
# Build & Push (Azure Container Registry)
# ==========================================

build-image:
  stage: build

  image: mcr.microsoft.com/azure-cli:2.86.0

  id_tokens:
    AZURE_TOKEN:
      aud: api://AzureADTokenExchange

  before_script:
    - |
      az login \
        --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --tenant "$AZURE_TENANT_ID" \
        --federated-token "$AZURE_TOKEN"

    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

build-image:
  stage: build

  image: docker:28.3

  services:
    - docker:28.3-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  id_tokens:
    AZURE_TOKEN:
      aud: api://AzureADTokenExchange

  before_script:
    # Install Azure CLI
    - apk add --no-cache curl bash python3 py3-pip
    - pip install azure-cli

    # Authenticate to Azure using OIDC
    - |
      az login \
        --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --tenant "$AZURE_TENANT_ID" \
        --federated-token "$AZURE_TOKEN"

    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

    # Login to Azure Container Registry
    - az acr login --name $ACR_NAME

  script:
    # Build Docker image
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .

    # Tag image for ACR
    - docker tag \
        $IMAGE_NAME:$IMAGE_TAG \
        $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

    # Push image
    - docker push \
        $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

# ==========================================
# Deploy
# ==========================================

deploy:
  stage: deploy

  image: mcr.microsoft.com/azure-cli:2.86.0

  id_tokens:
    AZURE_TOKEN:
      aud: api://AzureADTokenExchange

  before_script:
    - |
      az login \
        --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --tenant "$AZURE_TENANT_ID" \
        --federated-token "$AZURE_TOKEN"

    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

  script:
    - |
      az containerapp update \
        --name $CONTAINER_APP_NAME \
        --resource-group $RESOURCE_GROUP \
        --image $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

  environment:
    name: staging
    url: https://aca-pyweb-hajar.orangecliff-d127cb29.francecentral.azurecontainerapps.io

  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/azure-container-apps"'
      when: on_success

# ==========================================
# Infrastructure Setup (Bonus)
# ==========================================

infra:setup:
  stage: infra

  script:
    - echo "Infrastructure setup handled with PowerShell scripts."

  when: manual

# ==========================================
# Infrastructure Teardown (Bonus)
# ==========================================

infra:teardown:
  stage: infra

  script:
    - echo "Infrastructure teardown handled with PowerShell scripts."

  when: manual