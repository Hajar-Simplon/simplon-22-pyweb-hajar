include:
  - template: Jobs/SAST.gitlab-ci.yml

variables:
  IMAGE_NAME: pyweb-app
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

  ACR_NAME: acrhajar2026

  RESOURCE_GROUP: rg-hajar-aca-prf2026

  CONTAINER_APP_NAME: aca-pyweb-hajar

stages:
  - test
  - build
  - deploy
  - infra

# ==========================================
# Common Python configuration
# ==========================================

.python-job:
  image: python:3.14

  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt

# ==========================================
# Lint
# ==========================================

lint:
  extends: .python-job
  stage: test

  before_script:
    - pip install flake8

  script:
    - flake8 app.py

# ==========================================
# Tests
# ==========================================

tests:
  extends: .python-job
  stage: test

  script:
    - pytest

# ==========================================
# Build & Push (Azure ACR Build)
# ==========================================

build-image:
  stage: build

  image: mcr.microsoft.com/azure-cli:2.86.0

  id_tokens:
    AZURE_TOKEN:
      aud: api://AzureADTokenExchange

  before_script:
    - az login \
        --service-principal \
        -u "$AZURE_CLIENT_ID" \
        -t "$AZURE_TENANT_ID" \
        --federated-token "$AZURE_TOKEN"

    - az account set \
        --subscription "$AZURE_SUBSCRIPTION_ID"

  script:
    - |
      az acr build \
        --registry $ACR_NAME \
        --image $IMAGE_NAME:$IMAGE_TAG \
        .

# ==========================================
# Deploy
# ==========================================

deploy:
  stage: deploy

  image: mcr.microsoft.com/azure-cli:2.86.0

  id_tokens:
    AZURE_TOKEN:
      aud: api://AzureADTokenExchange

  before_script:
    - az login \
        --service-principal \
        -u "$AZURE_CLIENT_ID" \
        -t "$AZURE_TENANT_ID" \
        --federated-token "$AZURE_TOKEN"

    - az account set \
        --subscription "$AZURE_SUBSCRIPTION_ID"

  script:
    - |
      az containerapp update \
        --name $CONTAINER_APP_NAME \
        --resource-group $RESOURCE_GROUP \
        --image $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/azure-container-apps"'
      when: on_success

# ==========================================
# Infrastructure Setup 
# ==========================================

infra:setup:
  stage: infra

  script:
    - echo "Infrastructure setup handled with PowerShell scripts."

  when: manual

# ==========================================
# Infrastructure Teardown 
# ==========================================

infra:teardown:
  stage: infra

  script:
    - echo "Infrastructure teardown handled with PowerShell scripts."

  when: manual 