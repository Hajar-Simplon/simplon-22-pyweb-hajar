include:
  - template: Jobs/SAST.gitlab-ci.yml

variables:
  IMAGE_NAME: pyweb-app
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

  ACR_NAME: acrhajar2026
  RESOURCE_GROUP: hmezouarRG
  CONTAINER_APP_NAME: aca-pyweb-hajar

stages:
  - test
  - infra-setup
  - build
  - deploy
  - infra-teardown

# ==========================================
# Common Python configuration
# ==========================================

.python-job:
  image: python:3.14

  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt

# ==========================================
# Lint
# ==========================================

lint:
  extends: .python-job
  stage: test

  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install flake8

  script:
    - flake8 app.py

# ==========================================
# Build & Push (Azure Container Registry)
# ==========================================

build-image:
  stage: build

  image: registry.gitlab.com/hajarmezouar/simplon-22-pyweb-hajar/toolbox:v2

  services:
    - docker:28.3-dind
    
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  id_tokens:
    AZURE_TOKEN:
      aud: api://AzureADTokenExchange

  before_script:

    # Authenticate to Azure using OIDC
    - |
      az login \
        --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --tenant "$AZURE_TENANT_ID" \
        --federated-token "$AZURE_TOKEN"

    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    
    - echo "===== Docker environment ====="
    - env | grep DOCKER || true

    - echo "===== Docker version ====="
    - docker version

    - echo "===== Docker info ====="
    - docker info

    # Login to Azure Container Registry
    - az acr login --name $ACR_NAME

  script:
    # Build Docker image
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .

    # Tag image for ACR
    - docker tag $IMAGE_NAME:$IMAGE_TAG $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

    # Push image
    - docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

# ==========================================
# Deploy
# ==========================================

deploy:
  stage: deploy

  image: registry.gitlab.com/hajarmezouar/simplon-22-pyweb-hajar/toolbox:v2

  id_tokens:
    AZURE_TOKEN:
      aud: api://AzureADTokenExchange

  before_script:
    - |
      az login \
        --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --tenant "$AZURE_TENANT_ID" \
        --federated-token "$AZURE_TOKEN"

    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

  script:
    - |
        az containerapp update \
          --name $CONTAINER_APP_NAME \
          --resource-group $RESOURCE_GROUP \
          --image $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG
  
        APP_URL=$(az containerapp show \
          --name $CONTAINER_APP_NAME \
          --resource-group $RESOURCE_GROUP \
          --query properties.configuration.ingress.fqdn \
          -o tsv)
  
        echo "DYNAMIC_ENVIRONMENT_URL=https://$APP_URL" > deploy.env
  
  artifacts:
    reports:
      dotenv: deploy.env
  
  environment:
    name: staging
    url: $DYNAMIC_ENVIRONMENT_URL

# ==========================================
# Infrastructure Setup 
# ==========================================

infra:setup:
  stage: infra-setup
  image: registry.gitlab.com/hajarmezouar/simplon-22-pyweb-hajar/toolbox:v2

  script:
    - pwsh ./infra/create.ps1

  when: manual

# ==========================================
# Infrastructure Teardown 
# ==========================================

infra:teardown:
  stage: infra-teardown
  image: registry.gitlab.com/hajarmezouar/simplon-22-pyweb-hajar/toolbox:v2

  script:
    - pwsh ./infra/destroy.ps1

  when: manual