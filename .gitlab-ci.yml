include:
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - test
  - lint
  - build

lint:
  stage: lint
  image: python:3.14

  before_script:
    - pip install flake8

  script:
    - flake8 app.py

build-image:
  stage: build
  image: docker:28.3

  services:
    - docker:28.3-dinddind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - apk add --no-cache make

  script:
    - make build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: manual